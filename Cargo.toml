[package]
name = "tls450-plus-snapshot-audit-log-tool"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Open a TLS-450 Plus snapshot .tar, filter and search its audit trail, alarms and leak tests, save to .txt"

[[bin]]
name = "TLS-450-Plus-Snapshot-Audit-Log-Tool"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "links"] }
# "links" lets the program open web pages (release notes, downloads).
rfd = "0.17"
egui_extras = { version = "0.36", default-features = false }
png = { version = "0.18", optional = true }
# Update check and download (GitHub releases), with built-in TLS roots.
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
embed-resource = "3"

[features]
# Dev only: saves screenshots of set UI states for review (see src/shots.rs).
review-shots = ["dep:png"]

[profile.release]
opt-level = 3
strip = true
